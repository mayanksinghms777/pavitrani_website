# Nginx configuration for pavitrani.com on Hostinger VPS
# Place in /etc/nginx/sites-available/pavitrani.com and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name pavitrani.com www.pavitrani.com;

    root /var/www/pavitrani/dist;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets (JS, CSS, WebP, images, icons)
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|css|js|woff2|woff|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # SPA fallback for React hash/history routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
